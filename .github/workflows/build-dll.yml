name: Build DahlDesign DLL

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache SimHub build requirements
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            innounp050.rar
            SimHub.8.01.2.zip
          key: SimHub.8.01.2

      - name: Download build requirements
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          aria2c -j1 -o innounp050.rar "https://sourceforge.net/projects/innounp/files/innounp/innounp%200.50/innounp050.rar/download"
          aria2c -j1 -o SimHub.8.01.2.zip "https://github.com/SHWotever/SimHub/releases/download/8.1.2/SimHub.8.01.2.zip"

      - name: Extract build requirements
        run: |
          7z x innounp050.rar
          7z x SimHub.8.01.2.zip
          New-Item -ItemType Directory -Force -Path "D:\Program Files (x86)\SimHub"
          & "$env:GITHUB_WORKSPACE\innounp.exe" -v -x -b -e '-dD:\Program Files (x86)\SimHub\' SimHubSetup_8.1.2.exe GameReaderCommon.dll SimHub.plugins.dll log4net.dll SharpDX.dll SimHub.logging.dll Microsoft.Bcl.AsyncInterfaces.dll
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\DLLs"
          & "$env:GITHUB_WORKSPACE\innounp.exe" -v -x -b -e "-d$env:GITHUB_WORKSPACE\DLLs" SimHubSetup_8.1.2.exe ACSharedMemory.dll ACToolsUtilities.dll GameReaderCommon.dll ICarsReader.dll InputManagerCS.dll iRacingSDK.dll SimHub.logging.dll SimHub.plugins.dll log4net.dll
          & "$env:GITHUB_WORKSPACE\innounp.exe" -v -x -b -e '-dD:\Program Files (x86)\SimHub\' SimHubSetup_8.1.2.exe MahApps.*.dll

      - name: Restore packages
        run: nuget restore "Dahl Design Properties.sln"

      - name: Copy CsvHelper
        run: Copy-Item "$env:USERPROFILE\.nuget\packages\csvhelper\30.0.1\*.dll" "D:\Program Files (x86)\SimHub\"

      - name: Build release DLL
        run: msbuild "Dahl Design Properties.sln" -t:rebuild -property:Configuration=Release

      - name: Verify DLL
        run: |
          $dll = "$env:GITHUB_WORKSPACE\bin\Release\DahlDesign.dll"
          if (-not (Test-Path -LiteralPath $dll)) { throw "DahlDesign.dll was not produced" }
          Get-Item -LiteralPath $dll | Format-List Name,Length,LastWriteTime

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: DahlDesign-DLL
          path: bin/Release/DahlDesign.dll
          if-no-files-found: error
